consume_filament:
  target:
    entity:
      domain: number
      integration: ha_filament_manager
  fields:
    amount:
      required: true
      example: 25
      selector:
        number:
          min: 0.1
          max: 100000
          unit_of_measurement: g
          mode: box

refill_spool:
  target:
    entity:
      domain: number
      integration: ha_filament_manager
  fields:
    amount:
      required: false
      example: 1000
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: g
          mode: box

load_spool:
  fields:
    spool:
      required: true
      selector:
        device:
          integration: ha_filament_manager
    slot:
      required: true
      example: sensor.p1s_ams_1_tray_1
      selector:
        entity:
          domain: sensor
          integration: bambu_lab

unload_spool:
  fields:
    spool:
      required: true
      selector:
        device:
          integration: ha_filament_manager

move_spool:
  fields:
    spool:
      required: true
      selector:
        device:
          integration: ha_filament_manager
    box:
      required: true
      selector:
        device:
          integration: ha_filament_manager
          model: Filamentbox

open_spool:
  fields:
    spool:
      required: true
      selector:
        text:
    box:
      required: true
      selector:
        device:
          integration: ha_filament_manager
          model: Filamentbox

add_spool:
  fields:
    box:
      required: false
      selector:
        device:
          integration: ha_filament_manager
          model: Filamentbox
    material:
      required: true
      example: PLA
      selector:
        text:
    color:
      required: true
      example: Schwarz
      selector:
        text:
    manufacturer:
      required: true
      example: Bambu Lab
      selector:
        text:
    diameter:
      required: false
      example: "1.75"
      selector:
        text:
    name:
      required: false
      selector:
        text:
    total_weight:
      required: false
      example: 1000
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: g
          mode: box
    remaining_weight:
      required: false
      example: 1000
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: g
          mode: box
    low_stock_threshold:
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    notify_targets:
      required: false
      selector:
        entity:
          domain: notify
          multiple: true
    persistent_notification:
      required: false
      selector:
        boolean:

